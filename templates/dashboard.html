<!-- Dashboard Partial View -->
<div class="dashboard-view">
    <div class="metrics-grid">
        <div class="metric-card">
            <span class="metric-label">TOTAL ITEMS PROCESSED</span>
            <div class="metric-value-row">
                <span class="metric-number" id="dash-total-items">350</span>
            </div>
        </div>
        <div class="metric-card">
            <span class="metric-label">SUCCESS RATE</span>
            <div class="metric-value-row">
                <span class="metric-number" id="dash-success-rate">99.2%</span>
            </div>
            <div class="mini-progress-track">
                <div class="mini-progress-fill bg-success" style="width: 99.2%"></div>
            </div>
        </div>
        <div class="metric-card">
            <span class="metric-label">DATABASE SYNC STATUS</span>
            <div class="metric-value-row">
                <span class="metric-number text-success">Active</span>
                <span class="pulse-dot"></span>
            </div>
        </div>
        <div class="metric-card">
            <span class="metric-label">CONTRACTUAL HEADERS</span>
            <div class="metric-value-row">
                <span class="metric-number">252</span>
                <span class="metric-sub">columns</span>
            </div>
        </div>
    </div>
</div>
